<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tumbleweed Run</title><style>:root{color-scheme:dark;font:16px/1.5 system-ui;background:#191816;color:#f3eee5}body{margin:0;padding:20px}main{max-width:1400px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:26px}canvas{display:block;width:100%;background:#302b24;touch-action:none}button{font:inherit;background:#edb861;color:#251a0a;border:0;border-radius:5px;padding:12px 20px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:4px}a{color:#edb861}.hidden,[hidden]{display:none!important}.opening-dialogue{padding:16px 0;max-width:700px}.opening-dialogue strong{color:#edb861}.opening-dialogue p{font-size:18px}.opening-dialogue button{margin-right:12px}#intro,#end{padding:20px 0}nav{display:flex;gap:24px;padding:12px 0}@media(max-width:600px){body{padding:10px}h1{font-size:22px}}
body{padding:0;overflow:hidden;background:#17110c}main{position:relative;max-width:none;width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center}canvas{width:100%;max-height:100dvh;object-fit:contain}header,nav,#intro,#end{display:none!important}.opening-dialogue{position:absolute;left:15%;top:10%;max-width:min(420px,65vw);padding:18px 22px;background:#fff4d3;color:#302015;border:3px solid #754528;border-radius:22px;box-shadow:0 5px 12px #0006;cursor:pointer}.opening-dialogue[data-speaker="white"]{left:45%}.opening-dialogue strong{color:#73431e}.opening-dialogue p{font-size:clamp(15px,2vw,22px);margin:8px 0}.opening-dialogue button{display:none}.opening-dialogue:not([data-speaker]){display:none}#prompt{position:absolute;inset:0;z-index:5;background:#24150cdd;color:#fff2cb;display:grid;place-content:center;text-align:center;font-size:clamp(26px,5vw,60px);font-weight:800;padding:10vw;cursor:pointer}#prompt[hidden]{display:none}
#speedUp{position:absolute;right:4%;bottom:9%;z-index:4;background:#f8ca64;color:#3b220d;border:2px solid #76491d;border-radius:999px;font-weight:800;box-shadow:0 5px 14px #0008;touch-action:manipulation}#speedUp[hidden]{display:none}#speedUp.boosted{animation:boost .7s ease-out}@keyframes boost{35%{transform:scale(1.25);background:#fff3a2}100%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){#speedUp.boosted{animation:none}}canvas{width:100vw;height:100dvh;max-height:none;object-fit:cover}@media(max-width:700px){canvas{object-fit:contain}.opening-dialogue{left:5%!important;top:8%;max-width:80vw}} </style></head><body><main><button id="speedUp" hidden>Tap to speed up · 8×</button><div id="prompt" hidden>Tap to bury and lock the supply</div><header><h1>Tumbleweed Run</h1><a href="/">Back to editor</a><button id="startTop">Replay opening</button></header><nav><span id="stage">Stage 1 / 9</span><span id="score">0 yd</span></nav><canvas id="game" width="2172" height="724" aria-label="Horse race. Tap or press Space to jump."></canvas><div id="intro"><p>Meet the riders, then race through the trail. Tap or press Space to jump over tumbleweeds.</p><button id="start">Meet the riders</button></div><div id="end" class="hidden"><h2 id="endTitle"></h2><p id="endText"></p><button id="again">Try again</button></div></main><script src="opening.js?v=6"></script><script src="game.js?v=8"></script></body></html>
